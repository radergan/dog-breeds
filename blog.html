<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Dog Breed Finder</title>
    <meta name="description" content="Dog care tips, breed guides, training advice, and more from Dog Breed Finder.">
    <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre.min.css">
    <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-exp.min.css">
    <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        #recent-posts-sidebar .subfamily-item:hover,
        #categories-sidebar .subfamily-item:hover {
            background: #f5f5f5;
            border-radius: 4px;
        }
        
        #recent-posts-sidebar .subfamily-item {
            transition: background 0.2s;
        }
        
        #categories-sidebar .subfamily-item {
            transition: background 0.2s;
        }
        
        #tags-sidebar .chip:hover {
            background: #302f79;
            transform: translateY(-1px);
        }
        
        .blog-header {
            margin-bottom: 40px;
        }
        
        .blog-header h1 {
            font-size: 36px;
            color: #302f79;
            margin-bottom: 10px;
        }
        
        .blog-header p {
            font-size: 16px;
            color: #666;
        }
        
        .blog-list {
            margin-bottom: 40px;
        }
        
        .blog-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
            transition: background 0.2s;
        }
        
        .blog-item:hover {
            background: #f9f9f9;
        }
        
        .blog-item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            background: #f0f0f0;
            flex-shrink: 0;
        }
        
        .blog-item-content {
            flex: 1;
            min-width: 0;
        }
        
        .blog-item-category {
            background: #5755d9;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 6px;
        }
        
        .blog-item-title {
            font-size: 18px;
            font-weight: 600;
            color: #302f79;
            margin-bottom: 4px;
        }
        
        .blog-item-title a {
            color: inherit;
            text-decoration: none;
        }
        
        .blog-item-title a:hover {
            color: #5755d9;
        }
        
        .blog-item-excerpt {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .blog-item-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #888;
        }
        
        .blog-item-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .blog-item-actions {
            flex-shrink: 0;
        }
        
        .blog-item-link {
            display: inline-block;
            background: #5755d9;
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .blog-item-link:hover {
            background: #302f79;
        }
        
        .no-posts {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }
        
        .no-posts h2 {
            color: #302f79;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="logo">woof_db</a>
                <div class="tagline">&nbsp Find Your Perfect Dog Breed</div>
            </div>
        </div>
    </header>

    <nav class="top-nav">
        <div class="top-nav-container">
            <div class="stats-bar">
                <div class="stat-item">
                    <a href="index.html" style="color: inherit; text-decoration: none;">Home</a>
                </div>
                <div class="stat-item">
                    <a href="blog.html" style="color: inherit; text-decoration: none; font-weight: bold;">Blog</a>
                </div>
                <div class="stat-item">
                    <span>About Us</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="side-nav">
                <div class="accordion">
                    <input type="checkbox" id="accordion-0" name="accordion-checkbox" checked>
                    <label class="accordion-header" for="accordion-0">Recent Posts</label>
                    <div class="accordion-body">
                        <div id="recent-posts-sidebar">
                            <p style="color: #888; font-size: 13px; padding: 8px 0;">No posts yet</p>
                        </div>
                    </div>
                </div>
                
                <div class="accordion">
                    <input type="checkbox" id="accordion-1" name="accordion-checkbox" checked>
                    <label class="accordion-header" for="accordion-1">Categories</label>
                    <div class="accordion-body">
                        <div id="categories-sidebar">
                            <p style="color: #888; font-size: 13px; padding: 8px 0;">No categories yet</p>
                        </div>
                    </div>
                </div>

                <div class="accordion">
                    <input type="checkbox" id="accordion-2" name="accordion-checkbox" checked>
                    <label class="accordion-header" for="accordion-2">Popular Tags</label>
                    <div class="accordion-body">
                        <div id="tags-sidebar" style="display: flex; flex-wrap: wrap; gap: 8px;">
                            <p style="color: #888; font-size: 13px; padding: 8px 0;">No tags yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="blog-header">
                <h1>Blog</h1>
                <p>Dog care tips, breed guides, training advice, and more</p>
            </div>

            <div class="blog-list" id="blog-grid">
                <!-- Blog posts will be inserted here by JavaScript -->
            </div>
            
            <div class="no-posts" id="no-posts" style="display: none;">
                <h2>No posts yet</h2>
                <p>Check back soon for dog care tips and breed guides!</p>
            </div>
        </main>
    </div>

    <script src="blog-posts.js"></script>
    <script>
        // Render blog posts
        const blogGrid = document.getElementById('blog-grid');
        const noPosts = document.getElementById('no-posts');
        
        if (blogPosts.length === 0) {
            blogGrid.style.display = 'none';
            noPosts.style.display = 'block';
        } else {
            blogPosts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'blog-item';
                
                const imageHtml = post.featuredImage 
                    ? `<img src="${post.featuredImage}" alt="${post.title}" class="blog-item-image">`
                    : '<div class="blog-item-image" style="background: linear-gradient(135deg, #5755d9 0%, #302f79 100%);"></div>';
                
                const categoryHtml = post.category 
                    ? `<span class="blog-item-category">${post.category}</span>`
                    : '';
                
                // Generate random engagement numbers for display (likes/shares)
                const likes = Math.floor(Math.random() * 50) + 5;
                const shares = Math.floor(Math.random() * 20) + 2;
                
                item.innerHTML = `
                    ${imageHtml}
                    <div class="blog-item-content">
                        ${categoryHtml}
                        <h2 class="blog-item-title">
                            <a href="blog/${post.slug}.html">${post.title}</a>
                        </h2>
                        <div class="blog-item-excerpt">${post.excerpt || ''}</div>
                        <div class="blog-item-meta">
                            <span class="blog-item-meta-item">📅 ${post.publishedDate}</span>
                            <span class="blog-item-meta-item">❤ ${likes} likes</span>
                            <span class="blog-item-meta-item">↗ ${shares} shares</span>
                        </div>
                    </div>
                    <div class="blog-item-actions">
                        <a href="blog/${post.slug}.html" class="blog-item-link">Read Article</a>
                    </div>
                `;
                
                blogGrid.appendChild(item);
            });
            
            // Populate sidebar with blog data
            populateSidebar();
        }
        
        function populateSidebar() {
            // Recent Posts (last 5)
            const recentPostsContainer = document.getElementById('recent-posts-sidebar');
            if (blogPosts.length > 0) {
                const recentPosts = blogPosts.slice(0, 5);
                recentPostsContainer.innerHTML = recentPosts.map(post => `
                    <div class="subfamily-item" style="cursor: pointer; padding: 8px 0;" onclick="window.location.href='blog/${post.slug}.html'">
                        <div class="subfamily-name" style="font-size: 14px; color: #302f79;">${post.title}</div>
                        <div class="subfamily-desc" style="font-size: 12px;">${post.publishedDate}</div>
                    </div>
                `).join('');
            }
            
            // Categories
            const categoriesContainer = document.getElementById('categories-sidebar');
            const categoryCount = {};
            blogPosts.forEach(post => {
                if (post.category) {
                    categoryCount[post.category] = (categoryCount[post.category] || 0) + 1;
                }
            });
            
            if (Object.keys(categoryCount).length > 0) {
                categoriesContainer.innerHTML = Object.entries(categoryCount)
                    .sort(([a], [b]) => a.localeCompare(b))
                    .map(([category, count]) => `
                        <div class="subfamily-item" style="cursor: pointer; padding: 8px 0;">
                            <div class="subfamily-name">${category}</div>
                            <div class="subfamily-desc">${count} post${count !== 1 ? 's' : ''}</div>
                        </div>
                    `).join('');
            }
            
            // Tags
            const tagsContainer = document.getElementById('tags-sidebar');
            const allTags = new Set();
            blogPosts.forEach(post => {
                if (post.tags && typeof post.tags === 'string') {
                    post.tags.split(',').forEach(tag => allTags.add(tag.trim()));
                }
            });
            
            if (allTags.size > 0) {
                tagsContainer.innerHTML = Array.from(allTags)
                    .sort()
                    .map(tag => `
                        <span class="chip" style="font-size: 11px; padding: 4px 10px; cursor: pointer;">${tag}</span>
                    `).join('');
            }
        }
    </script>
</body>
</html>
